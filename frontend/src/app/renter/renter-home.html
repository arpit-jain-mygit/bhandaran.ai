<!-- Renter's main screen. -->
<app-welcome-banner
  [name]="auth.user()?.name"
  role="Renter"
  message="Find storage space near you and keep track of the bags you store in each godown."
  actionLabel="Find storage space"
  actionLink="/"
/>
<section class="card">
  <h2>My bookings</h2>
  <p class="muted">Your storage bookings and the bags you keep in each godown will appear here.</p>
  <a routerLink="/">Find storage space</a>
</section>
