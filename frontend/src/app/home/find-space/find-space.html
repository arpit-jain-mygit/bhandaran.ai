<!-- Find space: choose a place and filters (type or pick), then Search. -->
<section class="card">
  <div class="title">
    <app-icon name="search" [size]="20" />
    <h2>Find storage space</h2>
    @if (pending() > 0) {
      <app-grain-loader [size]="24" label="Loading options" />
    }
  </div>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <form class="grid" (ngSubmit)="search()">
    <div class="field">
      <label for="fs-state"><app-icon name="map-pin" [size]="14" /> State</label>
      <app-combobox
        inputId="fs-state"
        name="state"
        placeholder="Type or select a state"
        [allowClear]="true"
        [options]="stateOptions()"
        [ngModel]="stateId"
        (ngModelChange)="onStateChange($event)"
      />
    </div>

    <div class="field">
      <label for="fs-district">District</label>
      <app-combobox
        inputId="fs-district"
        name="district"
        [placeholder]="stateId ? 'Type or select a district' : 'Pick a state first'"
        [allowClear]="true"
        [options]="districtOptions()"
        [disabled]="!stateId"
        [ngModel]="districtId"
        (ngModelChange)="onDistrictChange($event)"
      />
    </div>

    <div class="field">
      <label for="fs-city">City / Town</label>
      <app-combobox
        inputId="fs-city"
        name="city"
        [placeholder]="districtId ? 'Type or select a city / town' : 'Pick a district first'"
        [allowClear]="true"
        [options]="cityOptions()"
        [disabled]="!districtId"
        [(ngModel)]="cityId"
      />
    </div>

    <div class="field">
      <label for="fs-pincode">Pincode</label>
      <input
        id="fs-pincode"
        name="pincode"
        inputmode="numeric"
        maxlength="6"
        placeholder="Any"
        [(ngModel)]="pincode"
      />
    </div>

    <div class="field">
      <label for="fs-storage"><app-icon name="warehouse" [size]="14" /> Storage type</label>
      <app-combobox
        inputId="fs-storage"
        name="storageType"
        placeholder="Any"
        [allowClear]="true"
        [options]="storageOptions()"
        [(ngModel)]="storageTypeId"
      />
    </div>

    <div class="field">
      <label for="fs-stock"><app-icon name="package" [size]="14" /> What will you store?</label>
      <app-combobox
        inputId="fs-stock"
        name="stockType"
        placeholder="Any"
        [allowClear]="true"
        [options]="stockOptions()"
        [(ngModel)]="stockTypeId"
      />
    </div>

    <div class="field">
      <label for="fs-price">Max price per unit / month (₹)</label>
      <input
        id="fs-price"
        name="maxPrice"
        type="number"
        min="0"
        placeholder="Any"
        [(ngModel)]="maxPrice"
      />
    </div>

    <div class="field">
      <label for="fs-space">Space needed (units)</label>
      <input
        id="fs-space"
        name="minCapacity"
        type="number"
        min="1"
        placeholder="Any"
        [(ngModel)]="minCapacity"
      />
    </div>

    <button type="submit" class="search"><app-icon name="search" /> Search</button>
  </form>
</section>
