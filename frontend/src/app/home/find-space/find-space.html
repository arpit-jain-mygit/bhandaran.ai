<!-- Find space: choose a place and filters, then Search (M7). -->
<section class="card">
  <div class="title">
    <h2>Find storage space</h2>
    @if (pending() > 0) {
      <app-grain-loader [size]="28" label="Loading options" />
    }
  </div>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <form class="grid" (ngSubmit)="search()">
    <label>
      State
      <select name="state" [ngModel]="stateId" (ngModelChange)="onStateChange($event)">
        <option value="">Select state</option>
        @for (s of states(); track s.id) {
          <option [value]="s.id">{{ s.name }}</option>
        }
      </select>
    </label>

    <label>
      District
      <select
        name="district"
        [ngModel]="districtId"
        (ngModelChange)="onDistrictChange($event)"
        [disabled]="!stateId"
      >
        <option value="">{{ stateId ? 'Select district' : 'Pick a state first' }}</option>
        @for (d of districts(); track d.id) {
          <option [value]="d.id">{{ d.name }}</option>
        }
      </select>
    </label>

    <label>
      City / Town
      <select name="city" [(ngModel)]="cityId" [disabled]="!districtId">
        <option value="">{{ districtId ? 'Select city / town' : 'Pick a district first' }}</option>
        @for (c of cities(); track c.id) {
          <option [value]="c.id">{{ c.name }}</option>
        }
      </select>
    </label>

    <label>
      Storage type
      <select name="storageType" [(ngModel)]="storageTypeId">
        <option value="">Any</option>
        @for (t of storageTypes(); track t.id) {
          <option [value]="t.id">{{ t.name }}</option>
        }
      </select>
    </label>

    <label>
      What will you store?
      <select name="stockType" [(ngModel)]="stockTypeId">
        <option value="">Any</option>
        @for (t of stockTypes(); track t.id) {
          <option [value]="t.id">{{ t.name }}</option>
        }
      </select>
    </label>

    <label>
      Pincode
      <input
        name="pincode"
        inputmode="numeric"
        maxlength="6"
        placeholder="Any"
        [(ngModel)]="pincode"
      />
    </label>

    <label>
      Max price per unit / month (₹)
      <input name="maxPrice" type="number" min="0" placeholder="Any" [(ngModel)]="maxPrice" />
    </label>

    <label>
      Space needed (units)
      <input name="minCapacity" type="number" min="1" placeholder="Any" [(ngModel)]="minCapacity" />
    </label>

    <button type="submit">Search</button>
  </form>
</section>
