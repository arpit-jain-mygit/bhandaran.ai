<!-- My profile: name, city, optional GST number. -->
<h1>My profile</h1>

@if (loading()) {
  <p class="loading"><app-grain-loader [size]="28" label="Loading your profile" /> Loading…</p>
} @else if (profile(); as me) {
  <p class="muted email"><app-icon name="mail" [size]="15" /> {{ me.email }}</p>

  <form class="card" (ngSubmit)="save()">
    <label for="name"><app-icon name="user" [size]="14" /> Name</label>
    <input id="name" name="name" autocomplete="name" required maxlength="100" [(ngModel)]="name" />

    <label for="city"><app-icon name="map-pin" [size]="14" /> City or town</label>
    <app-combobox
      inputId="city"
      name="city"
      placeholder="Type or select your city / town"
      [allowClear]="true"
      [options]="cityOptions()"
      [(ngModel)]="cityId"
    />

    <label for="gst">GST number <span class="muted">(optional)</span></label>
    <input
      id="gst"
      name="gst"
      autocomplete="off"
      maxlength="15"
      placeholder="23ABCDE1234F1Z5"
      [(ngModel)]="gst"
    />

    <button type="submit" [disabled]="busy() || !name.trim()">
      <app-icon name="save" /> Save profile
    </button>
  </form>
}

@if (notice()) {
  <p class="msg notice" role="status">{{ notice() }}</p>
}
@if (error()) {
  <p class="msg error" role="alert">{{ error() }}</p>
}
