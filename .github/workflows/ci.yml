# ---------------------------------------------------------------
# App CI: runs on every pull request and every push to main.
#   backend  -> ruff lint + format check, pytest
#   frontend -> production build, unit tests (Vitest)
# No AWS needed. Backend tests use a throwaway PostgreSQL container.
# ---------------------------------------------------------------
name: ci

on:
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  # ---------- FastAPI backend ----------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Throwaway PostgreSQL for tests (same major version as local dev).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bhandaran_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Tests connect here (see backend/tests/conftest.py).
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/bhandaran_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

  # ---------- Angular frontend ----------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false
