# ---------------------------------------------------------------
# Python project definition for the bhandaran.ai backend (FastAPI).
# Install for development:  pip install -e ".[dev]"
# ---------------------------------------------------------------
[project]
name = "bhandaran-backend"
version = "0.1.0"
description = "bhandaran.ai API - warehouse space marketplace"
requires-python = ">=3.12"

# Runtime libraries (pinned so every machine and CI gets the same versions).
dependencies = [
    "fastapi==0.162.0",               # web framework
    "uvicorn[standard]==0.54.0",      # server that runs FastAPI
    "sqlalchemy==2.1.6",              # database toolkit / ORM
    "alembic==1.20.1",                # database migrations
    "psycopg[binary]==3.3.7",         # PostgreSQL driver
    "psycopg-pool==3.3.3",            # connection pool (needed by the DSQL connector)
    "aurora-dsql-sqlalchemy==1.3.0",  # AWS dialect: IAM auth + DSQL SQL rules
    "boto3==1.43.123",                # AWS SDK (credentials for DSQL)
    "pydantic-settings==2.16.2",      # settings from env vars / .env
]

# Extra tools only needed while developing and in CI.
[project.optional-dependencies]
dev = [
    "pytest==9.2.0",   # test runner
    "httpx2==2.16.0",  # HTTP client used by FastAPI's TestClient
    "ruff==0.17.3",    # linter + formatter
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# Only the "app" package is shipped (not tests or migrations).
[tool.setuptools.packages.find]
include = ["app*"]

# ---------- Ruff: lint + format rules ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = errors, I = import order, B = likely bugs, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
