# ---------------------------------------------------------------
# Alembic (database migrations) settings.
# The database connection is NOT set here: migrations/env.py reuses
# the app's own engine, so DB_MODE=local|dsql works the same way.
#
#   alembic upgrade head                       apply all migrations
#   alembic revision -m "create stock_type"    new empty migration
# ---------------------------------------------------------------
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# File names like 20261103_1530_create_stock_type.py (sortable by date).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# ---------- Logging (what Alembic prints while running) ----------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
